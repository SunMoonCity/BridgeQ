services:
  - type: web
    name: bridgeq
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false          # Set this manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://bridgeq.onrender.com
      - key: ADMIN_EMAIL
        sync: false          # Set this manually in Render dashboard
      - key: ADMIN_ROLL_NO
        sync: false          # Set this manually in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false          # Set this manually in Render dashboard
