<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bridge Builder</title>

<!-- JSXGraph -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.0/distrib/jsxgraph.css" />
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.0/distrib/jsxgraphcore.js"></script>

<!-- Matter.js -->
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>

<style>
  body { font-family: sans-serif; margin: 20px; }
  #hud { display: flex; gap: 20px; margin-bottom: 10px; font-weight: bold; }
  #jxgbox { width: 700px; height: 400px; border: 1px solid #ccc; }
  #controls { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #messageBox { margin-top: 8px; min-height: 20px; }
  #deleteButton { display: none; }
  #resultBox { margin-top: 20px; }
</style>
</head>
<body>

<!-- ===================================================================
     HUD -- read/written by main.js's updateHud() and onTimerTick()
     =================================================================== -->
<div id="hud">
  <span>Round: <span id="statRound">--</span></span>
  <span>Time: <span id="statTime">--:--</span></span>
  <span>Spent: <span id="statSpent">0</span></span>
  <span>Remaining: <span id="statRemaining">--</span></span>
</div>

<!-- ===================================================================
     Board -- graph.js's initBoard() targets this div by id
     =================================================================== -->
<div id="jxgbox"></div>

<!-- ===================================================================
     Build controls -- read by graph.js's getInputValues(), disabled by
     disableBuildPhase() when the build phase ends
     =================================================================== -->
<div id="controls">
  <input type="text" id="equationInput" placeholder="e.g. 2*x + 1" />
  <input type="number" id="rangeMin" placeholder="min" step="0.1" style="width:70px" />
  <input type="number" id="rangeMax" placeholder="max" step="0.1" style="width:70px" />

  <!-- Options populated dynamically by graph.js's populateMaterialPicker() -->
  <select id="materialInput"></select>

  <select id="orientationInput">
    <option value="y-of-x">y = f(x)</option>
    <option value="x-of-y">x = f(y)</option>
  </select>

  <button id="plotButton">Plot Piece</button>
  <button id="deleteButton">Delete Selected</button>
  <button id="testBridgeButton">Test Bridge</button>
</div>

<div id="messageBox"></div>

<!-- ===================================================================
     Result / summary area -- written by main.js's showRoundResult() and
     showFinalSummary()
     =================================================================== -->
<div id="resultBox"></div>

<!-- Entry point -- type="module" is required since main.js/graph.js/etc.
     all use ES module import/export syntax -->
<script type="module" src="js/main.js"></script>
</body>
</html>
